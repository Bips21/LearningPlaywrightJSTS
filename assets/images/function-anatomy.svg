<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript function anatomy</title>
  <desc id="desc">Arguments enter a function through parameters, the function body performs work, and a return value is sent back to the caller.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="430" rx="28" fill="url(#bg)"/>
  <text x="56" y="66" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Functions package reusable logic</text>
  <text x="56" y="96" fill="#a5f3fc" font-family="Segoe UI,Arial,sans-serif" font-size="15">A roadmap concept: this repository currently focuses on JavaScript fundamentals.</text>
  <rect x="54" y="181" width="176" height="88" rx="16" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="142" y="214" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">CALLER</text>
  <text x="142" y="244" text-anchor="middle" fill="#f8fafc" font-family="Consolas,monospace" font-size="17">arguments</text>
  <path d="M232 225H304" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="322" y="150" width="318" height="150" rx="20" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="481" y="184" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">FUNCTION</text>
  <text x="481" y="222" text-anchor="middle" fill="#f8fafc" font-family="Consolas,monospace" font-size="20">function add(a, b) {</text>
  <text x="481" y="252" text-anchor="middle" fill="#c4b5fd" font-family="Consolas,monospace" font-size="18">  return a + b;</text>
  <text x="481" y="280" text-anchor="middle" fill="#f8fafc" font-family="Consolas,monospace" font-size="20">}</text>
  <path d="M642 225H714" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="732" y="181" width="176" height="88" rx="16" fill="#115e59" stroke="#2dd4bf" stroke-width="2"/>
  <text x="820" y="214" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">RESULT</text>
  <text x="820" y="244" text-anchor="middle" fill="#f8fafc" font-family="Consolas,monospace" font-size="17">return value</text>
  <text x="481" y="355" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="15">Define once · call with inputs · reuse wherever needed</text>
</svg>
